    <div class="page-header">
      <div><div class="page-title"><i class="fa-solid fa-chart-pie"></i> Ocupación de Celdas</div></div>
      <button class="btn btn-secondary" id="btn-reload-ocup" style="font-size:11px">↺ ACTUALIZAR</button>
    </div>
    <div id="ocup-content">Cargando...</div>
  </div>`;

  async function load() {
    const [celdas, tiposCelda, tipos] = await Promise.all([
      api('ocupacionCeldas'), api('listarTodosTiposCelda'), api('listarTiposResiduo')
    ]);
    const tiposMap = {};
    tipos.forEach(t => { tiposMap[t.id_tipoResiduo] = t.Nombre; });

    // Paleta de colores por tipo de residuo
    const colores = [
      'badge-blue','badge-green','badge-amber','badge-red',
      {bg:'#f3e8ff',color:'#7c3aed',border:'#ddd6fe'}, // púrpura
      {bg:'#fff7ed',color:'#c2410c',border:'#fed7aa'}, // naranja
    ];
    const colorMap = {};
    tipos.forEach((t,i) => { colorMap[t.id_tipoResiduo] = i; });

    function tipoBadge(idTipo) {
      const idx = colorMap[idTipo] ?? 0;
      const n = tiposMap[idTipo] || idTipo;
      const presets = ['badge-blue','badge-green','badge-amber','badge-red'];
      if (idx < presets.length) return `<span class="badge ${presets[idx]}" style="font-size:8px">${n}</span>`;
      const custom = [{bg:'#f3e8ff',color:'#7c3aed',border:'#ddd6fe'},{bg:'#fff7ed',color:'#c2410c',border:'#fed7aa'}];
      const c = custom[(idx - presets.length) % custom.length];
      return `<span class="badge" style="background:${c.bg};color:${c.color};border-color:${c.border};font-size:8px">${n}</span>`;
    }

    document.getElementById('ocup-content').innerHTML = `
      <div class="card-grid">
        ${celdas.map(ce => {
          const p = ce.porcentaje || (ce.Capacidad_max>0 ? Math.round(Number(ce.Peso_acumulado)/Number(ce.Capacidad_max)*100) : 0);
          const cls = p>=90?'high':p>=60?'mid':'low';
          const bcls = p>=90?'badge-red':p>=60?'badge-amber':'badge-green';
          // Borde de la card según ocupación
          const cardBorder = p>=90?'var(--danger)':p>=60?'var(--warn)':'var(--border)';
          const tiposDeCelda = (tiposCelda||[]).filter(tc => {
            const idCelda = tc.id_celda ?? tc.id_Celda;
            const activo  = tc.Activo ?? tc.activo;
            return String(idCelda)===String(ce.id_celda) && Number(activo)===1;
          });
          // Filas de kg por tipo de residuo
          const filasTipo = tiposDeCelda.map(tc => {
            const idTipo = tc.id_tipoResiduo ?? tc.id_tiporesiduo;
            const pesoTipo = Number(tc.Peso_acumulado ?? tc.peso_acumulado ?? 0);
            const capTotal = Number(ce.Capacidad_max) || 1;
            const pctTipo  = Math.round(pesoTipo / capTotal * 100);
            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:11px">
              ${tipoBadge(idTipo)}
              <span style="font-family:var(--mono);font-weight:600">${pesoTipo.toLocaleString()} kg <span style="color:var(--text3)">(${pctTipo}%)</span></span>
            </div>`;
          }).join('');

          return `<div class="stat-card" style="cursor:default;border-color:${cardBorder};border-width:1.5px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <div style="font-size:13px;font-weight:600">${ce.Nombre}</div>
              <div style="display:flex;align-items:center;gap:6px">
                <span class="badge ${bcls}">${p}%</span>
                ${Number(ce.Activo)===0?'<span class="badge badge-red" style="font-size:9px">INACTIVA</span>':''}
              </div>
            </div>
            <div class="progress" style="margin-bottom:6px"><div class="progress-fill ${cls}" style="width:${p}%"></div></div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:8px">
              <span><b>${Number(ce.Peso_acumulado).toLocaleString()}</b> kg acumulados</span>
              <span>cap. ${Number(ce.Capacidad_max).toLocaleString()} kg</span>
            </div>
            ${tiposDeCelda.length ? `
            <div style="border-top:1px solid var(--border);padding-top:6px">
              <div style="font-size:9px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;margin-bottom:4px">KG POR TIPO DE RESIDUO</div>
              ${filasTipo}
            </div>` : '<div style="font-size:10px;color:var(--text3)">Sin tipos asignados</div>'}
            <div style="font-size:11px;color:var(--text2);margin-top:6px;border-top:1px solid var(--border);padding-top:4px">
              Disponible: <span style="color:${p>=90?'var(--danger)':'var(--success)'};font-weight:600">${(Number(ce.Capacidad_max)-Number(ce.Peso_acumulado)).toLocaleString()} kg</span>
            </div>
          </div>`;
        }).join('')}
      </div>`;
  }

  runFlow('ocupacion');
  document.getElementById('btn-reload-ocup').addEventListener('click', () => { runFlow('ocupacion'); load(); });
  await load();
}

            return '<tr>' +
              '<td style="font-family:var(--mono)">#' + (d.id_ingreso||'—') + '</td>' +
              '<td>$' + vt.toLocaleString() + '</td>' +
              '<td style="color:' + (vm>0?'var(--danger)':'var(--text3)') + '">' + (vm>0?'−$'+vm.toLocaleString():'—') + '</td>' +
              '<td style="font-weight:600">$' + vs.toLocaleString() + '</td>' +
              '</tr>';

      openModal(
        '<div class="modal-title">DETALLE LIQ. #' + id + ' — ' + (liq?.contratista||'') + '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">' +

function fmtDate(d) {
  if (!d) return '—';
  if (typeof d === 'string' && d.startsWith('Date(')) {
    const parts = d.replace('Date(','').replace(')','').split(',');
    return new Date(Number(parts[0]), Number(parts[1]), Number(parts[2])).toLocaleDateString('es-CO');
  }
  // Parsear fechas ISO sin desfase de zona horaria
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d)) {
    const [y, m, day] = d.substring(0,10).split('-').map(Number);
    return new Date(y, m-1, day).toLocaleDateString('es-CO');
  }
  const dt = new Date(d);
  if (isNaN(dt)) return String(d).substring(0,10);
  return dt.toLocaleDateString('es-CO');
}

(function() {
  let dragging=false, ox=0, oy=0, px=0, py=0;
  const handle = document.getElementById('erd-drag-handle');
  const panel  = document.getElementById('erd-panel');
  if (!handle) return;
  handle.addEventListener('mousedown', e => {
    if (e.target.classList.contains('erd-close')) return;
    dragging=true;
    const r=panel.getBoundingClientRect();
    ox=e.clientX-r.left; oy=e.clientY-r.top;
    panel.style.right='auto'; panel.style.bottom='auto';
    px=r.left; py=r.top;
    panel.style.left=px+'px'; panel.style.top=py+'px';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    panel.style.left=(e.clientX-ox)+'px';
    panel.style.top=(e.clientY-oy)+'px';
  });
  document.addEventListener('mouseup', () => dragging=false);
})();

/* ============================================================
   APPS SCRIPT CORREGIDO — Pegar en Google Apps Script
   Cambios vs versión anterior:
   1. registrarIngreso: soporta celdas_distribucion (array multi-celda)
      y marca celda como INACTIVA cuando alcanza capacidad_max
   2. asignarTipoResiduo: usa findIndex en lugar de indexOf para
      soportar nombres de columna con cualquier capitalización
   ============================================================

function asignarTipoResiduo(data) {
  const sheet = getSheet("Celda_Tipo_residuo");
  const headers = sheet.getRange(1,1,1,sheet.getLastColumn()).getValues()[0].map(h=>String(h));
  const id = nextId(sheet);
  const row = headers.map(h => {
    const hl = h.toLowerCase();
    if (hl === 'id_celdaresiduo' || hl === 'id') return id;
    if (hl === 'id_celda')                        return data.id_celda;
    if (hl === 'id_tiporesiduo')                  return data.id_tipoResiduo;
    if (hl === 'peso_acumulado')                  return 0;
    if (hl === 'activo')                          return 1;
    return '';
  });
  sheet.appendRow(row);
  return { ok: true };
}

function registrarIngreso(data) {
  const sheet = getSheet("Ingreso");
  const id = nextId(sheet);

  const vehiculos = sheetToObjects(getSheet("Vehiculo"));
  const v = vehiculos.find(r => Number(r.id_vehiculo) === Number(data.id_vehiculo));
  const tara = v ? Number(v.Tara) : 0;
  const peso_neto = Number(data.peso_bruto) - tara;

  const limites = sheetToObjects(getSheet("Limite_autorizado"));
  const limite = limites.find(r =>
    Number(r.id_tipoVehiculo) === Number(v?.id_tipoVehiculo) &&
    Number(r.id_tipoResiduo)  === Number(data.id_tipoResiduo)
  );
  const sobrepeso = limite && peso_neto > Number(limite.Peso_max_kg) ? 1 : 0;
  const exceso    = sobrepeso ? peso_neto - Number(limite.Peso_max_kg) : 0;

  sheet.appendRow([
    id, data.id_centro||1, data.id_vehiculo, data.id_conductor,
    data.id_tipoResiduo, data.id_usuario,
    data.id_limite || (limite ? limite.id_limite : ""),
    new Date(), Number(data.peso_bruto), peso_neto,
    sobrepeso, exceso, data.observaciones||""
  ]);

  // Distribución multi-celda
  const distribucion = data.celdas_distribucion ||
    (data.id_celda ? [{id_celda: data.id_celda, kg: peso_neto}] : []);

  if (distribucion.length) {
    const cSheet  = getSheet("Celda");
    const cData   = cSheet.getDataRange().getValues();
    const headers = cData[0].map(h=>String(h).toLowerCase());
    const idxId   = headers.findIndex(h=>h==='id_celda');
    const idxPeso = headers.findIndex(h=>h==='peso_acumulado');
    const idxCap  = headers.findIndex(h=>h==='capacidad_max');
    const idxAct  = headers.findIndex(h=>h==='activo');
    const icSheet = getSheet("Ingreso_celda");

    distribucion.forEach(d => {
      for (let i = 1; i < cData.length; i++) {
        if (Number(cData[i][idxId]) === Number(d.id_celda)) {
          const actual   = Number(cData[i][idxPeso]) || 0;
          const nuevo    = actual + Number(d.kg);
          cSheet.getRange(i+1, idxPeso+1).setValue(nuevo);
          if (idxCap>=0 && idxAct>=0) {
            const cap = Number(cData[i][idxCap]);
            if (cap>0 && nuevo>=cap) cSheet.getRange(i+1, idxAct+1).setValue(0);
          }
          break;
        }
      }
      icSheet.appendRow([nextId(icSheet), d.id_celda, id, Number(d.kg)]);
    });
  }
  return { id_ingreso: id, peso_neto, sobrepeso, exceso };
}
============================================================ */
</script>
