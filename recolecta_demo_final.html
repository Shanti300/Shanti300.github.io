<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECOLECTA E.S.P — Sistema de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ============================================================
   VARIABLES & RESET
============================================================ */
:root {
  --bg:       #f5f6fa;
  --bg2:      #ffffff;
  --bg3:      #f0f2f8;
  --surface:  #f8f9fc;
  --border:   #e2e6f0;
  --border2:  #ccd0de;
  --primary:  #2563eb;
  --primary2: #1d4ed8;
  --primary-light: #eff6ff;
  --success:  #16a34a;
  --success-light: #f0fdf4;
  --success-border: #bbf7d0;
  --warn:     #d97706;
  --warn-light: #fffbeb;
  --warn-border: #fde68a;
  --danger:   #dc2626;
  --danger-light: #fef2f2;
  --danger-border: #fecaca;
  --text:     #111827;
  --text2:    #6b7280;
  --text3:    #9ca3af;
  --mono:     'IBM Plex Mono', monospace;
  --sans:     'Inter', sans-serif;
  --r:        8px;
  --r2:       12px;
  --shadow:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow2:  0 4px 12px rgba(0,0,0,.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; overflow: hidden; }

/* ── LAYOUT ── */
#app { display: flex; flex-direction: column; height: 100vh; }
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 24px; height: 52px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; box-shadow: var(--shadow);
}
#topbar .logo { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--primary); letter-spacing: 1px; }
#topbar .sep { width: 1px; height: 20px; background: var(--border); }
#topbar .rol-badge {
  font-size: 11px; font-weight: 500; color: var(--primary);
  background: var(--primary-light); border: 1px solid #bfdbfe;
  padding: 3px 10px; border-radius: 20px;
}
#topbar .user-info { font-size: 13px; color: var(--text2); font-weight: 500; }
#topbar .spacer { flex: 1; }
#topbar #btn-logout {
  font-size: 12px; font-weight: 500; color: var(--text2);
  background: none; border: 1px solid var(--border);
  padding: 5px 14px; border-radius: var(--r); cursor: pointer; transition: all .2s;
}
#topbar #btn-logout:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-light); }

#main { display: flex; flex: 1; overflow: hidden; }

/* ── NAV ── */
#nav {
  width: 216px; flex-shrink: 0;
  background: var(--bg2); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 8px;
}
#nav .nav-section {
  font-size: 10px; font-weight: 600; color: var(--text3);
  padding: 8px 12px 6px; letter-spacing: 1px; text-transform: uppercase;
}
#nav .nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; cursor: pointer; color: var(--text2); font-size: 13px; font-weight: 500;
  border-radius: var(--r); transition: all .15s; margin-bottom: 2px;
}
#nav .nav-item:hover { color: var(--text); background: var(--bg3); }
#nav .nav-item.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }
#nav .nav-icon { width: 18px; text-align: center; font-size: 13px; color: inherit; }

/* ── CONTENT ── */
#content { flex: 1; overflow-y: auto; padding: 24px; position: relative; background: var(--bg); }

/* ── ERD FLOTANTE ── */
#erd-panel {
  position: fixed; right: 20px; top: 70px;
  width: 480px; height: 560px;
  background: #0a1120; border: 1px solid #1e3050;
  border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  display: none; flex-direction: column; z-index: 300;
  resize: both; overflow: hidden; min-width: 340px; min-height: 340px;
}
#erd-panel.visible { display: flex; }
#erd-panel .erd-title {
  font-family: var(--mono); font-size: 10px; color: #4a7aaa;
  padding: 10px 14px; border-bottom: 1px solid #1e3050;
  letter-spacing: 1.5px; display: flex; align-items: center; gap: 8px;
  cursor: move; user-select: none; flex-shrink: 0;
  background: #0d1628; border-radius: 12px 12px 0 0;
}
#erd-panel .erd-title .dot { width: 6px; height: 6px; background: #3b82f6; border-radius: 50%; animation: pulse 2s infinite; }
#erd-panel .erd-title .erd-label { flex:1; }
#erd-panel .erd-title .erd-hint { font-size: 9px; color: #334d70; }
#erd-panel .erd-close { background:none; border:none; color:#4a7aaa; cursor:pointer; font-size:14px; padding:2px 6px; border-radius:4px; }
#erd-panel .erd-close:hover { background:#1e3050; color:#93c5fd; }
#erd-panel .erd-toolbar { display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid #1a2840; background:#0c1425; flex-shrink:0; }
#erd-panel .erd-toolbar button { background:#1a2840; border:1px solid #1e3050; color:#4a7aaa; font-size:11px; padding:3px 10px; border-radius:4px; cursor:pointer; font-family:var(--mono); }
#erd-panel .erd-toolbar button:hover { background:#1e3a5f; color:#93c5fd; }
#erd-panel .erd-toolbar .zoom-val { font-family:var(--mono); font-size:10px; color:#4a7aaa; min-width:32px; text-align:center; }
#erd-svg-wrap { flex: 1; overflow: auto; position: relative; background: #080f1e; cursor: grab; }
#erd-svg-wrap:active { cursor: grabbing; }
#erd-svg-inner { transform-origin: 0 0; transition: transform .1s; }
#erd-log {
  height: 80px; border-top: 1px solid #1a2840; flex-shrink:0;
  overflow-y: auto; padding: 5px 10px; font-family: var(--mono); font-size: 9px;
  color: #4a7aaa; background: #080f1e;
}
#erd-log .log-line { padding: 2px 0; }
#erd-log .log-line.active { color: #60a5fa; }
#erd-log .log-line.info { color: #93c5fd; }
/* Botón ERD oculto — usar Ctrl+Shift+M */
#erd-btn { display: none; }

/* ── ERD SVG ── */
.erd-table { transition: all .3s; cursor:pointer; }
.erd-table rect.body { fill: #111d33; stroke: #1e3050; stroke-width: 1; }
.erd-table rect.header { fill: #162040; stroke: #1e3050; stroke-width: 1; }
.erd-table text.tname { fill: #5a8ab4; font-family: 'IBM Plex Mono', monospace; font-size: 6.5px; font-weight:600; }
.erd-table text.field  { fill: #2e5070; font-family: 'IBM Plex Mono', monospace; font-size: 5.5px; }
.erd-table text.field.pk { fill: #b45309; }
.erd-table text.field.fk { fill: #7c3aed; }
.erd-conn { stroke: #1e3050; stroke-width: .8; fill: none; transition: all .3s; }
.erd-table.highlighted rect.body { fill: #0d1e3d; stroke: #3b82f6; stroke-width: 2; }
.erd-table.highlighted rect.header { fill: #162860; stroke: #3b82f6; stroke-width: 2; }
.erd-table.highlighted text.tname { fill: #60a5fa; }
.erd-table.highlighted text.field  { fill: #7ab8e0; }
.erd-conn.highlighted { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 5 2; animation: dashflow .6s linear infinite; }

/* ── LOGIN ── */
#screen-login {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, #eff6ff 0%, #f5f6fa 50%, #f0fdf4 100%);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
#screen-login.hidden { display: none; }
.login-box {
  width: 380px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 40px; box-shadow: var(--shadow2);
}
.login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.login-brand-icon { width: 36px; height: 36px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.login-brand-icon i { color: white; font-size: 16px; }
.login-logo { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--text); }
.login-sub { font-size: 13px; color: var(--text2); margin-bottom: 32px; margin-top: 4px; }

/* ── FORMS ── */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg2); border: 1.5px solid var(--border); color: var(--text);
  padding: 9px 12px; border-radius: var(--r); font-family: var(--sans); font-size: 13px;
  transition: border-color .2s, box-shadow .2s; outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.field select option { background: var(--bg2); }
.field .field-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: var(--r); font-family: var(--sans); font-size: 13px;
  font-weight: 500; cursor: pointer; border: none; transition: all .2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary2); box-shadow: 0 4px 12px rgba(37,99,235,.3); }
.btn-secondary { background: var(--bg2); color: var(--text); border: 1.5px solid var(--border); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.btn-danger { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-border); }
.btn-amber { background: var(--warn-light); color: var(--warn); border: 1px solid var(--warn-border); }
.btn-success { background: var(--success-light); color: var(--success); border: 1px solid var(--success-border); }
.btn-full { width: 100%; justify-content: center; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ── PAGE HEADER ── */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-title { font-size: 18px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.page-title i { color: var(--primary); font-size: 16px; }
.page-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }

/* ── TABLES ── */
.table-wrap { overflow-x: auto; border-radius: var(--r2); border: 1px solid var(--border); background: var(--bg2); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--surface); }
th { font-size: 11px; font-weight: 600; color: var(--text2); padding: 10px 14px; text-align: left; letter-spacing: .3px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); color: var(--text); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--primary-light); }

/* ── CARDS ── */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); padding: 20px; box-shadow: var(--shadow); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); padding: 16px; box-shadow: var(--shadow); }
.stat-val { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text2); margin-top: 3px; font-weight: 500; }

/* ── BADGES ── */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-green { background: var(--success-light); color: var(--success); border: 1px solid var(--success-border); }
.badge-amber { background: var(--warn-light); color: var(--warn); border: 1px solid var(--warn-border); }
.badge-red { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-border); }
.badge-blue { background: var(--primary-light); color: var(--primary); border: 1px solid #bfdbfe; }
.badge-gray { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }

/* ── ALERTS ── */
.alert { padding: 12px 16px; border-radius: var(--r); font-size: 13px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 8px; }
.alert i { margin-top: 1px; flex-shrink: 0; }
.alert-green { background: var(--success-light); border: 1px solid var(--success-border); color: var(--success); }
.alert-red { background: var(--danger-light); border: 1px solid var(--danger-border); color: var(--danger); }
.alert-amber { background: var(--warn-light); border: 1px solid var(--warn-border); color: var(--warn); }
.alert-blue { background: var(--primary-light); border: 1px solid #bfdbfe; color: var(--primary); }

/* ── PROGRESS ── */
.progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .6s ease; }
.progress-fill.low { background: var(--success); }
.progress-fill.mid { background: var(--warn); }
.progress-fill.high { background: var(--danger); }

/* ── WIZARD ── */
.wizard-steps { display: flex; gap: 0; margin-bottom: 24px; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--bg2); }
.wizard-step {
  flex: 1; text-align: center; padding: 10px 4px; font-size: 11px; font-weight: 500;
  color: var(--text3); border-right: 1px solid var(--border); transition: all .3s;
}
.wizard-step:last-child { border-right: none; }
.wizard-step.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }
.wizard-step.done { color: var(--success); background: var(--success-light); }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 200;
  font-size: 13px; font-weight: 500; padding: 12px 18px;
  border-radius: var(--r); max-width: 320px; opacity: 0;
  transition: opacity .3s, transform .3s; pointer-events: none;
  transform: translateY(8px); box-shadow: var(--shadow2);
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.success { background: var(--success-light); color: var(--success); border: 1px solid var(--success-border); }
#toast.error { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-border); }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
  z-index: 150; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
  padding: 28px; min-width: 380px; max-width: 520px; width: 92%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
  animation: fadein .2s ease;
}
.modal-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.modal-title i { color: var(--primary); }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ── RESPONSIVE ── */
@media(max-width:768px){
  #erd-panel { display: none !important; }
  #nav { width: 52px; }
  #nav .nav-item span { display: none; }
  #nav .nav-section { display: none; }
}

@keyframes dashflow { to { stroke-dashoffset: -12; } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
@keyframes fadein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.fadein { animation: fadein .3s ease; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="screen-login">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-brand-icon"><i class="fa-solid fa-recycle"></i></div>
      <div class="login-logo">RECOLECTA</div>
    </div>
    <div class="login-sub">E.S.P — Sistema de gestión de rellenos sanitarios</div>
    <div class="field"><label>Usuario</label><input id="inp-user" type="text" placeholder="Ingresa tu usuario" autocomplete="off"></div>
    <div class="field"><label>Contraseña</label><input id="inp-pass" type="password" placeholder="••••••••"></div>
    <div id="login-error" class="alert alert-red" style="display:none"></div>
    <button class="btn btn-primary btn-full" id="btn-login" style="padding:11px;font-size:14px">
      <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
    </button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" style="display:none">
  <!-- TOPBAR -->
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:28px;height:28px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center">
        <i class="fa-solid fa-recycle" style="color:white;font-size:12px"></i>
      </div>
      <div class="logo">RECOLECTA</div>
    </div>
    <div class="sep"></div>
    <i class="fa-solid fa-user-circle" style="color:var(--text3);font-size:15px"></i>
    <span class="user-info" id="top-user">—</span>
    <span class="rol-badge" id="top-rol">—</span>
    <div class="spacer"></div>
    <button id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
  </div>

  <div id="main">
    <!-- NAV -->
    <nav id="nav">
      <!-- Rendered by JS -->
    </nav>

    <!-- CONTENT -->
    <div id="content">
      <!-- Screens injected here -->
    </div>

    <!-- ERD PANEL FLOTANTE -->
    <div id="erd-panel">
      <div class="erd-title" id="erd-drag-handle">
        <div class="dot"></div>
        <span class="erd-label">MODELO RELACIONAL — RECOLECTA E.S.P</span>
        <span class="erd-hint">Ctrl+Shift+M</span>
        <button class="erd-close" onclick="document.getElementById('erd-panel').classList.remove('visible')" title="Cerrar">✕</button>
      </div>
      <div class="erd-toolbar">
        <button onclick="erdZoom(-0.15)">−</button>
        <span class="zoom-val" id="erd-zoom-val">100%</span>
        <button onclick="erdZoom(+0.15)">+</button>
        <button onclick="erdZoomReset()">⟳ Reset</button>
        <span style="flex:1"></span>
        <span style="font-size:9px;color:#334d70;font-family:var(--mono)">Arrastra para mover · Rueda para zoom</span>
      </div>
      <div id="erd-svg-wrap"><div id="erd-svg-inner"></div></div>
      <div id="erd-log"><div class="log-line info">// Ctrl+Shift+M para abrir · Clic en módulo para ver flujo</div></div>
    </div>
    <!-- Botón flotante -->
    <button id="erd-btn" onclick="toggleERD()" title="Ver Modelo Relacional">⬡</button>
  </div>
</div>

<div id="toast"></div>
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>

// Auto-incremento de IDs
function nextId(tabla) {
  const rows = DB[tabla];
  if (!rows || !rows.length) return 1;
  const keys = Object.keys(rows[0]).filter(k => k.toLowerCase().startsWith('id_') && typeof rows[0][k] === 'number');
  if (!keys.length) return rows.length + 1;
  const pk = keys[0];
  return Math.max(...rows.map(r => Number(r[pk]) || 0)) + 1;
}

// ============================================================
// API — reemplaza las llamadas a Apps Script
// ============================================================
async function api(action, body = {}) {
  // Simular delay de red
  await new Promise(r => setTimeout(r, 180));
  return apiFn(action, body);
}

function apiFn(action, body) {
  switch (action) {

    // AUTH
    case 'login': {
      const u = DB.Usuario.find(r =>
        r.Usuario.toLowerCase() === String(body.usuario).toLowerCase() &&
        String(r.Contrasena) === String(body.contrasena) && r.Activo
      );
      if (!u) throw new Error('Credenciales invalidas');
      const rol = DB.Rol.find(r => r.id_rol === u.id_rol);
      return { id_usuario: u.id_usuario, usuario: u.Usuario, rol: rol?.Nombre || 'SIN_ROL' };
    }

    // CONDUCTORES
    case 'buscarConductor': {
      const c = DB.Conductor.find(r => String(r.Cedula) === String(body.cedula) && r.Activo);
      if (!c) throw new Error('Conductor no encontrado o no autorizado');
      return c;
    }

    // VEHICULOS
    case 'buscarVehiculo': {
      const v = DB.Vehiculo.find(r => r.Placa.toUpperCase() === String(body.placa).toUpperCase() && r.Activo);
      if (!v) throw new Error('Vehiculo no encontrado o inactivo');
      const con = DB.Contratista.find(c => c.id_contratista === v.id_contratista);
      return { ...v, contratista: con?.Razon_social || '' };
    }

    // CALCULAR DISTRIBUCION
    case 'calcularDistribucion': {
      const pn = Number(body.peso_neto);
      const idTipo = Number(body.id_tipoResiduo);

      const idCentro = body.id_centro ? Number(body.id_centro) : null;
      // IDs de celdas autorizadas para este tipo (sin duplicados), filtradas por centro
      const idsCeldas = [...new Set(
        DB.Celda_Tipo_residuo
          .filter(r => r.id_tipoResiduo === idTipo && r.Activo !== 0)
          .map(r => r.id_celda)
          .filter(idC => {
            if (!idCentro) return true;
            const cel = DB.Celda.find(c => c.id_celda === idC);
            return cel && cel.id_centro === idCentro;
          })
      )];

      if (!idsCeldas.length) throw new Error('No hay celdas autorizadas para ese tipo de residuo');

      // Celdas elegibles: activas y con espacio
      const elegibles = DB.Celda
        .filter(c => idsCeldas.includes(c.id_celda) && c.Activo !== 0 && (c.Capacidad_max - c.Peso_acumulado) > 0)
        .sort((a, b) => a.Peso_acumulado - b.Peso_acumulado);

      if (!elegibles.length) throw new Error('Todas las celdas para ese tipo de residuo estan llenas');

      // Distribuir
      let restante = pn;
      const distribucion = [];
      for (const c of elegibles) {
        if (restante <= 0) break;
        const disp    = c.Capacidad_max - c.Peso_acumulado;
        const asignar = Math.min(restante, disp);
        distribucion.push({
          id_celda:   c.id_celda,
          nombre:     c.Nombre,
          kg_asignar: asignar,
          pct_actual: Math.round(c.Peso_acumulado / c.Capacidad_max * 100),
          disponible: disp
        });
        restante -= asignar;
      }
      return { distribucion, restante, cubre_total: restante <= 0 };
    }

    // VERIFICAR LIMITE
    case 'verificarLimite': {
      const tv = DB.Vehiculo.find(v => v.id_vehiculo === Number(body.id_tipoVehiculo))?.id_tipoVehiculo;
      const lim = DB.Limite_autorizado.find(l =>
        l.id_tipoVehiculo === (tv || Number(body.id_tipoVehiculo)) &&
        l.id_tipoResiduo  === Number(body.id_tipoResiduo)
      );
      if (!lim) return { sobrepeso: false, peso_max: null, exceso: 0 };
      const exceso = Number(body.peso_neto) - lim.Peso_max_kg;
      return { sobrepeso: exceso > 0, peso_max: lim.Peso_max_kg, exceso: exceso > 0 ? exceso : 0 };
    }

    // REGISTRAR INGRESO
    case 'registrarIngreso': {
      const v      = DB.Vehiculo.find(x => x.id_vehiculo === Number(body.id_vehiculo));
      const tara   = v ? v.Tara : 0;
      const pneto  = Number(body.peso_bruto) - tara;
      const tv     = v ? v.id_tipoVehiculo : 0;
      const lim    = DB.Limite_autorizado.find(l => l.id_tipoVehiculo === tv && l.id_tipoResiduo === Number(body.id_tipoResiduo));
      const sob    = lim && pneto > lim.Peso_max_kg ? 1 : 0;
      const exceso = sob ? pneto - lim.Peso_max_kg : 0;
      const id     = nextId('Ingreso');
      const fecha  = new Date().toISOString().replace('T',' ').substring(0,19);

      DB.Ingreso.push({
        id_ingreso: id, id_centro: Number(body.id_centro)||1,
        id_vehiculo: Number(body.id_vehiculo), id_conductor: Number(body.id_conductor),
        id_tipoResiduo: Number(body.id_tipoResiduo), id_usuario: Number(body.id_usuario),
        id_limite: lim?.id_limite || 0, Fecha_hora: fecha,
        Peso_bruto: Number(body.peso_bruto), Peso_neto: pneto,
        Sobrepeso: sob, Cantidad_exceso: exceso, Observaciones: body.observaciones || ''
      });

      // Distribucion multi-celda
      let dist = [];
      if (body.celdas_distribucion) {
        dist = typeof body.celdas_distribucion === 'string'
          ? JSON.parse(body.celdas_distribucion) : body.celdas_distribucion;
      } else if (body.id_celda) {
        dist = [{ id_celda: body.id_celda, kg: pneto }];
      }

      dist.forEach(d => {
        const ic = nextId('Ingreso_celda');
        DB.Ingreso_celda.push({ id_ingresoCelda: ic, id_celda: Number(d.id_celda), id_ingreso: id, Cantidad_descargada: Number(d.kg) });
        // Actualizar peso celda
        const cel = DB.Celda.find(c => c.id_celda === Number(d.id_celda));
        if (cel) {
          cel.Peso_acumulado += Number(d.kg);
          if (cel.Peso_acumulado >= cel.Capacidad_max) cel.Activo = 0;
        }
        // Actualizar peso en Celda_Tipo_residuo
        const ctr = DB.Celda_Tipo_residuo.find(r => r.id_celda === Number(d.id_celda) && r.id_tipoResiduo === Number(body.id_tipoResiduo));
        if (ctr) ctr.Peso_acumulado = (ctr.Peso_acumulado || 0) + Number(d.kg);
      });

      return { id_ingreso: id, peso_neto: pneto, sobrepeso: sob, exceso };
    }

    // LISTAS SIMPLES
    case 'listarMunicipios': return DB.Municipio;
    case 'listarTodosIngresos':
    case 'listarIngresos':   return [...DB.Ingreso].reverse();
    case 'listarCeldas': return DB.Celda.map(c => {
      const centro = DB.Centro_disposicion.find(x => x.id_centro === c.id_centro) || {};
      const unidad = DB.Unidad_medida.find(x => x.id_unidadMedida === c.id_unidadMedida) || { Nombre:'Kilogramo', Simbolo:'kg' };
      return { ...c, centro_nombre: centro.Nombre||'', unidad_simbolo: unidad.Simbolo||'kg', unidad_nombre: unidad.Nombre||'Kilogramo' };
    });
    case 'ocupacionCeldas': return DB.Celda.map(c => {
      const centro = DB.Centro_disposicion.find(x => x.id_centro === c.id_centro) || {};
      const unidad = DB.Unidad_medida.find(x => x.id_unidadMedida === c.id_unidadMedida) || { Nombre:'Kilogramo', Simbolo:'kg' };
      return { ...c, centro_nombre: centro.Nombre||'', unidad_simbolo: unidad.Simbolo||'kg', porcentaje: c.Capacidad_max > 0 ? Math.round(c.Peso_acumulado / c.Capacidad_max * 100) : 0 };
    });
    case 'listarContratistas': return DB.Contratista;
    case 'listarUsuarios': {
      return DB.Usuario.map(u => ({ ...u, rol_nombre: DB.Rol.find(r => r.id_rol === u.id_rol)?.Nombre || '' }));
    }
    case 'listarTarifas': {
      const ahora = new Date(); ahora.setHours(0,0,0,0);
      return DB.Tarifa_cabecera.map(t => {
        const det = DB.Tarifa_detalle.filter(d => d.id_tarifa === t.id_tarifa).slice(-1)[0] || {};
        const con = DB.Contratista.find(c => c.id_contratista === t.id_contratista);
        const tip = DB.Tipo_residuo.find(r => r.id_tipoResiduo === t.id_tipoResiduo);
        const ini = det.Fecha_inicio ? new Date(det.Fecha_inicio) : null;
        const fin = det.Fecha_fin    ? new Date(det.Fecha_fin)    : null;
        // Vigente: inicio <= hoy Y (sin fin O fin >= hoy)
        const vigente = ini && ini <= ahora && (!fin || fin >= ahora);
        // Futura: inicio > hoy
        const futura  = ini && ini > ahora;
        const vigencia_estado = !ini ? 'sin_fecha' : futura ? 'futura' : vigente ? 'vigente' : 'vencida';
        return {
          ...t,
          contratista:      con?.Razon_social||'',
          tipo_residuo:     tip?.Nombre||'',
          valor_por_unidad: det.Valor_por_unidad||0,
          Fecha_inicio:     det.Fecha_inicio||'',
          Fecha_fin:        det.Fecha_fin||'',
          vigente,
          vigencia_estado,  // 'vigente' | 'futura' | 'vencida' | 'sin_fecha'
        };
      });
    }
    case 'listarMultas':      return DB.Multa_config;
    case 'listarLimites':     return DB.Limite_autorizado;
    case 'listarTiposResiduo':return DB.Tipo_residuo;
    case 'listarTiposVehiculo':return DB.Tipo_vehiculo;
    case 'listarRoles':       return DB.Rol;
    case 'listarUnidades':    return DB.Unidad_medida;
    case 'listarCentros':     return DB.Centro_disposicion;
    case 'listarVehiculos':   return DB.Vehiculo;
    case 'listarConductores': return DB.Conductor;
    case 'listarTodosTiposCelda': return DB.Celda_Tipo_residuo;
    case 'listarTiposCelda':  return DB.Celda_Tipo_residuo.filter(r => r.id_celda === Number(body.id_celda) && r.Activo !== 0).map(r => ({ ...r, Nombre: DB.Tipo_residuo.find(t => t.id_tipoResiduo === r.id_tipoResiduo)?.Nombre || '' }));
    case 'listarLiquidaciones': return DB.Liquidacion.map(l => ({ ...l, contratista: DB.Contratista.find(c => c.id_contratista === l.id_contratista)?.Razon_social||'' }));
    case 'detalleLiquidacion': {
      return DB.Detalle_liquidacion
        .filter(d => d.id_liquidacion === Number(body.id_liquidacion))
        .map(d => {
          const ing  = DB.Ingreso.find(i => i.id_ingreso === d.id_ingreso) || {};
          const tipo = DB.Tipo_residuo.find(t => t.id_tipoResiduo === ing.id_tipoResiduo) || {};
          const veh  = DB.Vehiculo.find(v => v.id_vehiculo === ing.id_vehiculo) || {};
          return {
            ...d,
            Fecha_hora:     ing.Fecha_hora    || '',
            Peso_neto:      ing.Peso_neto     || 0,
            Sobrepeso:      ing.Sobrepeso     || 0,
            Cantidad_exceso:ing.Cantidad_exceso||0,
            tipo_residuo:   tipo.Nombre       || '',
            placa:          veh.Placa         || '',
          };
        });
    }

    // CREAR / EDITAR
    case 'crearContratista': {
      const id = nextId('Contratista');
      DB.Contratista.push({ id_contratista:id, Razon_social:body.razon_social||'', NIT:body.nit||'', Nombre_contacto:body.nombre_contacto||'', Telefono:body.telefono||'', Activo:1 });
      return { id_contratista: id };
    }
    case 'editarContratista': {
      const r = DB.Contratista.find(x => x.id_contratista === Number(body.id_contratista));
      if (r) { if(body.razon_social) r.Razon_social=body.razon_social; if(body.nit) r.NIT=body.nit; if(body.telefono) r.Telefono=body.telefono; if(body.nombre_contacto) r.Nombre_contacto=body.nombre_contacto; if(body.activo!==undefined) r.Activo=Number(body.activo); }
      return { ok:true };
    }
    case 'crearCelda': {
      const id  = nextId('Celda');
      const idU = Number(body.id_unidadMedida) || 1;
      const u   = DB.Unidad_medida.find(x => x.id_unidadMedida === idU) || { Factor_a_kg: 1 };
      const capKg = Number(body.capacidad_max) * Number(u.Factor_a_kg);
      DB.Celda.push({ id_celda:id, id_centro:Number(body.id_centro)||1, id_unidadMedida:idU, Nombre:body.nombre||'Celda '+id, Capacidad_max:capKg, Peso_acumulado:0, Activo:1 });
      return { id_celda: id };
    }
    case 'editarCelda': {
      const r = DB.Celda.find(x => x.id_celda === Number(body.id_celda));
      if (r) { if(body.nombre) r.Nombre=body.nombre; if(body.capacidad_max) r.Capacidad_max=Number(body.capacidad_max); if(body.activo!==undefined) r.Activo=Number(body.activo); }
      return { ok:true };
    }
    case 'asignarTipoResiduo': {
      // Si ya existe (inactivo), reactivar en lugar de duplicar
      const existing = DB.Celda_Tipo_residuo.find(r =>
        r.id_celda === Number(body.id_celda) && r.id_tipoResiduo === Number(body.id_tipoResiduo)
      );
      if (existing) {
        existing.Activo = 1;
      } else {
        const id = nextId('Celda_Tipo_residuo');
        DB.Celda_Tipo_residuo.push({ id_celdaResiduo:id, id_celda:Number(body.id_celda), id_tipoResiduo:Number(body.id_tipoResiduo), Peso_acumulado:0, Activo:1 });
      }
      return { ok:true };
    }
    case 'crearVehiculo': {
      const id = nextId('Vehiculo');
      DB.Vehiculo.push({ id_vehiculo:id, id_tipoVehiculo:Number(body.id_tipoVehiculo), id_contratista:Number(body.id_contratista), Placa:body.placa||'', Modelo:body.modelo||'', Tara:Number(body.tara)||0, Activo:1 });
      return { id_vehiculo:id };
    }
    case 'editarVehiculo': {
      const r = DB.Vehiculo.find(x => x.id_vehiculo === Number(body.id_vehiculo));
      if (r) { if(body.placa) r.Placa=body.placa; if(body.modelo) r.Modelo=body.modelo; if(body.tara) r.Tara=Number(body.tara); if(body.activo!==undefined) r.Activo=Number(body.activo); }
      return { ok:true };
    }
    case 'crearConductor': {
      const id = nextId('Conductor');
      DB.Conductor.push({ id_conductor:id, id_contratista:Number(body.id_contratista), Cedula:body.cedula||'', Nombre:body.nombre||'', Telefono:body.telefono||'', Activo:1 });
      return { id_conductor:id };
    }
    case 'editarConductor': {
      const r = DB.Conductor.find(x => x.id_conductor === Number(body.id_conductor));
      if (r) { if(body.cedula) r.Cedula=body.cedula; if(body.nombre) r.Nombre=body.nombre; if(body.telefono) r.Telefono=body.telefono; if(body.activo!==undefined) r.Activo=Number(body.activo); }
      return { ok:true };
    }
    case 'crearUsuario': {
      const id = nextId('Usuario');
      DB.Usuario.push({ id_usuario:id, id_rol:Number(body.id_rol), Usuario:body.usuario||'', Contrasena:body.contrasena||'', Activo:1 });
      return { id_usuario:id };
    }
    case 'editarUsuario': {
      const r = DB.Usuario.find(x => x.id_usuario === Number(body.id_usuario));
      if (r) { if(body.id_rol) r.id_rol=Number(body.id_rol); if(body.usuario) r.Usuario=body.usuario; if(body.contrasena) r.Contrasena=body.contrasena; if(body.activo!==undefined) r.Activo=Number(body.activo); }
      return { ok:true };
    }
    case 'crearTarifa': {
      const idCab = nextId('Tarifa_cabecera');
      DB.Tarifa_cabecera.push({ id_tarifa:idCab, id_contratista:Number(body.id_contratista), id_tipoResiduo:Number(body.id_tipoResiduo), Activo:1 });
      const idDet = nextId('Tarifa_detalle');
      DB.Tarifa_detalle.push({ id_tarifaDetalle:idDet, id_tarifa:idCab, Valor_por_unidad:Number(body.valor_por_unidad)||0, Fecha_inicio:body.fecha_inicio||'', Fecha_fin:'' });
      return { id_tarifa:idCab };
    }
    case 'editarTarifa': {
      const det = DB.Tarifa_detalle.filter(d => d.id_tarifa === Number(body.id_tarifa)).slice(-1)[0];
      if (det && body.valor_por_unidad) det.Valor_por_unidad = Number(body.valor_por_unidad);
      const cab = DB.Tarifa_cabecera.find(t => t.id_tarifa === Number(body.id_tarifa));
      if (cab && body.activo !== undefined) cab.Activo = Number(body.activo);
      return { ok:true };
    }
    case 'crearMulta': {
      const id = nextId('Multa_config');
      DB.Multa_config.push({ id_multa:id, id_contratista:Number(body.id_contratista), id_tipoResiduo:Number(body.id_tipoResiduo), Minimo_kg:Number(body.minimo_kg)||0, Maximo_kg:Number(body.maximo_kg)||0, Valor_multa:Number(body.valor_multa)||0 });
      return { id_multa:id };
    }
    case 'crearLimite': {
      const id = nextId('Limite_autorizado');
      DB.Limite_autorizado.push({ id_limite:id, id_tipoVehiculo:Number(body.id_tipoVehiculo), id_tipoResiduo:Number(body.id_tipoResiduo), Peso_max_kg:Number(body.peso_max_kg)||0 });
      return { id_limite:id };
    }
    case 'generarLiquidacion': {
      const idC   = Number(body.id_contratista);
      const fIni  = new Date(body.periodo_inicio); fIni.setHours(0,0,0,0);
      const fFin  = new Date(body.periodo_fin);    fFin.setHours(23,59,59,999);
      const vehs  = DB.Vehiculo.filter(v => v.id_contratista === idC).map(v => v.id_vehiculo);
      const ings  = DB.Ingreso.filter(i => vehs.includes(i.id_vehiculo) && new Date(i.Fecha_hora) >= fIni && new Date(i.Fecha_hora) <= fFin);
      if (!ings.length) throw new Error('No hay ingresos para este contratista en el periodo seleccionado');
      let totalKg=0, totalT=0, totalM=0;
      const detalles = ings.map(ing => {
        const fIng = new Date(ing.Fecha_hora);
        // Buscar tarifa vigente en la fecha del ingreso
        const tc = DB.Tarifa_cabecera.find(t => {
          if (t.id_contratista !== idC || t.id_tipoResiduo !== ing.id_tipoResiduo || !t.Activo) return false;
          const det = DB.Tarifa_detalle.filter(d => d.id_tarifa === t.id_tarifa).slice(-1)[0];
          if (!det) return false;
          const ini = det.Fecha_inicio ? new Date(det.Fecha_inicio) : new Date('2000-01-01');
          const fin = det.Fecha_fin    ? new Date(det.Fecha_fin)    : new Date('2099-12-31');
          return fIng >= ini && fIng <= fin;
        });
        const det = tc ? DB.Tarifa_detalle.filter(d=>d.id_tarifa===tc.id_tarifa).slice(-1)[0] : null;
        const vpu = det ? Number(det.Valor_por_unidad) : 0;
        const vt  = ing.Peso_neto * vpu;
        let vm = 0;
        if (ing.Sobrepeso && ing.Cantidad_exceso > 0) {
          const mc = DB.Multa_config.find(m => m.id_contratista===idC && m.id_tipoResiduo===ing.id_tipoResiduo && ing.Cantidad_exceso>=m.Minimo_kg && ing.Cantidad_exceso<=m.Maximo_kg);
          if (mc) vm = ing.Cantidad_exceso * mc.Valor_multa;
        }
        totalKg += ing.Peso_neto; totalT += vt; totalM += vm;
        return { id_ingreso:ing.id_ingreso, valor_transporte:vt, valor_multa:vm, subtotal:vt-vm };
      });
      const idLiq = nextId('Liquidacion');
      DB.Liquidacion.push({ id_liquidacion:idLiq, id_contratista:idC, Periodo_inicio:body.periodo_inicio, Periodo_fin:body.periodo_fin, Total_peso:totalKg, Valor_transporte:totalT, Valor_multas:totalM, Valor_total:totalT-totalM, Estado:'BORRADOR', Fecha_generacion:new Date().toISOString().substring(0,10) });
      detalles.forEach(d => { DB.Detalle_liquidacion.push({ id_detalle:nextId('Detalle_liquidacion'), id_liquidacion:idLiq, ...d }); });
      return { id_liquidacion:idLiq, total_peso:totalKg, valor_transporte:totalT, valor_multas:totalM, valor_total:totalT-totalM };
    }
    case 'aprobarLiquidacion': {
      const l = DB.Liquidacion.find(x => x.id_liquidacion === Number(body.id_liquidacion));
      if (l) l.Estado = 'APROBADA';
      return { ok:true };
    }

    default: throw new Error('Accion no reconocida: ' + action);
  }
}

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = ''; }, 3000);
}

// MODAL
// ============================================================
function openModal(html, onConfirm) {
  const o = document.getElementById('modal-overlay');
  const b = document.getElementById('modal-box');
  b.innerHTML = html;
  o.classList.add('open');
  if (onConfirm) {
    const btn = b.querySelector('[data-confirm]');
    if (btn) btn.addEventListener('click', async () => { await onConfirm(); closeModal(); });
  }
  b.querySelector('[data-close]')?.addEventListener('click', closeModal);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

// ERD
// ============================================================
const TW = 110, TH_HEAD = 16, TH_ROW = 10;
let erdScale = 1.0;
let erdDragState = null;

function erdZoom(delta) {
  erdScale = Math.max(0.3, Math.min(2.5, erdScale + delta));
  document.getElementById('erd-svg-inner').style.transform = `scale(${erdScale})`;
  document.getElementById('erd-zoom-val').textContent = Math.round(erdScale * 100) + '%';
}
function erdZoomReset() { erdScale = 1.0; erdZoom(0); }

function toggleERD() {
  const panel = document.getElementById('erd-panel');
  panel.classList.toggle('visible');
  if (panel.classList.contains('visible') && S.user) buildERD();
}

function buildERD() {
  const inner = document.getElementById('erd-svg-inner');
  if (!inner) return;

  const allX = ERD_TABLES.map(t => t.x + TW);
  const allY = ERD_TABLES.map(t => t.y + TH_HEAD + TH_ROW * t.fields.length);
  const maxX = Math.max(...allX) + 20;
  const maxY = Math.max(...allY) + 20;

  // Color por grupo
  const groupColor = {
    geo: '#1e3a8a', ops: '#0c4a6e', fleet: '#78350f',
    money: '#14532d', cat: '#3b0764', auth: '#831843', pivot: '#1e293b'
  };
  const tableGroup = {
    usuario:'auth', rol:'auth',
    ingreso:'ops', ingreso_celda:'ops',
    vehiculo:'fleet', conductor:'fleet', contratista:'fleet', vehiculo_con:'fleet',
    celda:'ops', celda_tipo:'ops', centro:'ops',
    tipo_residuo:'cat', tipo_vehiculo:'cat', unidad:'cat',
    liquidacion:'money', detalle_liq:'money', tarifa_cab:'money', tarifa_det:'money',
    multa_config:'money', limite:'cat',
    municipio:'geo', departamento:'geo',
  };

  let svg = `<svg id="erd-svg" width="${maxX}" height="${maxY}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb" opacity=".6"/></marker></defs>`;

  // Background grid
  svg += `<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 L0 0 0 20" fill="none" stroke="#0d1628" stroke-width="0.5"/></pattern>`;
  svg += `<rect width="${maxX}" height="${maxY}" fill="url(#grid)"/>`;

  // Connections
  ERD_CONNS.forEach(([a,b]) => {
    const ta = ERD_TABLES.find(t=>t.id===a), tb = ERD_TABLES.find(t=>t.id===b);
    if (!ta||!tb) return;
    const x1=ta.x+TW/2, y1=ta.y+TH_HEAD/2, x2=tb.x+TW/2, y2=tb.y+TH_HEAD/2;
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    svg += `<path class="erd-conn" id="conn-${a}-${b}" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" marker-end="url(#arr)"/>`;
  });

  // Tables
  ERD_TABLES.forEach(t => {
    const h = TH_HEAD + TH_ROW * t.fields.length + 6;
    const gc = groupColor[tableGroup[t.id]] || '#1e293b';
    svg += `<g class="erd-table" id="erd-${t.id}" transform="translate(${t.x},${t.y})">`;
    svg += `<rect class="body" x="0" y="0" width="${TW}" height="${h}" rx="4"/>`;
    svg += `<rect class="header" x="0" y="0" width="${TW}" height="${TH_HEAD}" rx="4" style="fill:${gc}"/>`;
    svg += `<rect x="0" y="${TH_HEAD-4}" width="${TW}" height="4" style="fill:${gc}"/>`;
    svg += `<text class="tname" x="${TW/2}" y="${TH_HEAD-4}" text-anchor="middle">${t.name}</text>`;
    t.fields.forEach((f,i) => {
      const isPK = f.toLowerCase().startsWith('id_') && i===0;
      const isFK = f.toLowerCase().startsWith('id_') && i>0;
      const cls  = isPK ? 'field pk' : isFK ? 'field fk' : 'field';
      const prefix = isPK ? '🔑 ' : isFK ? '↗ ' : '  ';
      svg += `<text class="${cls}" x="5" y="${TH_HEAD+5+TH_ROW*i+TH_ROW-2}">${prefix}${f}</text>`;
    });
    svg += `</g>`;
  });

  // Anotaciones de reglas de negocio
  const notes = [
    { x: 650, y: 200, w: 140, text: 'El sistema divide la carga entre celdas disponibles del centro seleccionado (menor ocupación primero)', color: '#1a3060' },
    { x: 10,  y: 870, w: 140, text: 'Si un vehículo excede el límite autorizado, se genera una multa en la liquidación mensual descontada del valor a pagar', color: '#3a1a1a' },
    { x: 460, y: 620, w: 120, text: 'Valor a liquidar por kg según tipo de residuo, contratista y vigencia de la tarifa', color: '#1a2a1a' },
  ];
  notes.forEach(n => {
    svg += `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="60" rx="4" style="fill:${n.color};stroke:#334155;stroke-width:1;stroke-dasharray:3 2"/>`;
    // Wrap text manually (max 25 chars per line)
    const words = n.text.split(' ');
    let lines2 = [], cur2 = '';
    words.forEach(w => { if ((cur2+' '+w).trim().length > 22) { lines2.push(cur2.trim()); cur2 = w; } else cur2 += ' '+w; });
    if (cur2.trim()) lines2.push(cur2.trim());
    lines2.slice(0,5).forEach((ln, li) => {
      svg += `<text x="${n.x+4}" y="${n.y+10+li*11}" style="fill:#94a3b8;font-family:'IBM Plex Mono',monospace;font-size:5px">${ln}</text>`;
    });
  });
  svg += '</svg>';
  inner.innerHTML = svg;

  // Wheel zoom
  const wrap = document.getElementById('erd-svg-wrap');
  wrap.onwheel = e => { e.preventDefault(); erdZoom(e.deltaY < 0 ? 0.1 : -0.1); };

  // Drag to pan
  wrap.onmousedown = e => { if(e.button===0) { erdDragState={x:e.clientX+wrap.scrollLeft, y:e.clientY+wrap.scrollTop}; } };
  wrap.onmousemove = e => { if(erdDragState) { wrap.scrollLeft=erdDragState.x-e.clientX; wrap.scrollTop=erdDragState.y-e.clientY; } };
  wrap.onmouseup = () => erdDragState=null;
  wrap.onmouseleave = () => erdDragState=null;
}

let erdFlowTimer = null;
function runFlow(flowKey) {
  const flow = FLOWS[flowKey];
  if (!flow) return;
  clearFlow();
  if (erdFlowTimer) clearTimeout(erdFlowTimer);

  const log = document.getElementById('erd-log');
  log.innerHTML = `<div class="log-line info" style="font-weight:600;color:#93c5fd">▶ ${flow.label} (${flow.steps.length} pasos)</div>`;

  let step = 0;
  function runStep() {
    if (step >= flow.steps.length) {
      setTimeout(clearFlow, 3000);
      return;
    }
    const s = flow.steps[step];
    clearHighlights();
    s.tables.forEach(tid => highlightTable(tid));
    highlightConns(s.tables);

    const line = document.createElement('div');
    line.className = 'log-line active';
    line.textContent = `[${String(step+1).padStart(2,'0')}/${flow.steps.length}] ${s.msg}`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;

    step++;
    erdFlowTimer = setTimeout(runStep, 1600);
  }
  runStep();
}

function clearHighlights() {
  document.querySelectorAll('.erd-table.highlighted').forEach(el => el.classList.remove('highlighted'));
  document.querySelectorAll('.erd-conn.highlighted').forEach(el => el.classList.remove('highlighted'));
}

function clearFlow() {
  clearHighlights();
  const log = document.getElementById('erd-log');
  log.innerHTML = `<div class="log-line info">// Ejecuta un flujo para ver las entidades activas</div>`;
}

function highlightTable(id) {
  const el = document.getElementById('erd-' + id);
  if (el) el.classList.add('highlighted');
}

function highlightConns(tables) {
  ERD_CONNS.forEach(([a,b]) => {
    if (tables.includes(a) || tables.includes(b)) {
      const el = document.getElementById(`conn-${a}-${b}`);
      if (el) el.classList.add('highlighted');
    }
  });
}

// Mapa pantalla → flujo (para disparar desde renderScreen directamente)
const SCREEN_FLOW = {
  ingreso:       'registrarIngreso',
  ingresos:      'historialIngresos',
  celdas:        'gestionCeldas',
  ocupacion:     'ocupacion',
  contratistas:  'gestionContratistas',
  liquidaciones: 'generarLiquidacion',
  aprobarliq:    'aprobarLiquidacion',
  usuarios:      'gestionUsuarios',
  tarifas:       'gestionTarifas',
  multas:        'gestionMultas',
  limites:       'gestionLimites',
};

async function renderScreen(id) {
  S.screen = id;
  const c = document.getElementById('content');
  c.innerHTML = '<div style="padding:20px;color:var(--text2);font-family:var(--mono);font-size:12px">Cargando...</div>';
  // Disparar flujo ERD automáticamente al cargar la pantalla
  const flowKey = SCREEN_FLOW[id];
  if (flowKey) setTimeout(() => runFlow(flowKey), 200);
  const screens = {
    ingreso:       screenIngreso,
    ingresos:      screenIngresos,
    celdas:        screenCeldas,
    ocupacion:     screenOcupacion,
    contratistas:  screenContratistas,
    liquidaciones: screenLiquidaciones,
    aprobarliq:    screenAprobarLiq,
    usuarios:      screenUsuarios,
    tarifas:       screenTarifas,
    multas:        screenMultas,
    limites:       screenLimites,
  };
  const fn = screens[id];
  if (!fn) { c.innerHTML = '<div class="alert alert-red" style="margin:20px">Pantalla no encontrada: ' + id + '</div>'; return; }
  try {
    await fn(c);
  } catch(e) {
    console.error('renderScreen error:', e);
    c.innerHTML = `<div class="alert alert-red" style="margin:20px">
      <b>Error cargando módulo</b><br>
      <span style="font-family:var(--mono);font-size:11px">${e.message}</span><br><br>
      <span style="font-size:11px;color:var(--text2)">Revisa la consola (F12) para más detalles</span>
    </div>`;
  }
}

// ----- INGRESO WIZARD -----
function screenIngreso(c) {
  c.innerHTML = `
  <div class="fadein">
    <div class="page-header">
      <div><div class="page-title"><i class="fa-solid fa-truck-ramp-box"></i> Registrar Ingreso</div><div class="page-sub">Portería principal — registro de vehículos</div></div>
    </div>
    <div class="wizard-steps">
      <div class="wizard-step active" id="ws1">1 CENTRO</div>
      <div class="wizard-step" id="ws2">2 CONDUCTOR</div>
      <div class="wizard-step" id="ws3">3 VEHÍCULO</div>
      <div class="wizard-step" id="ws4">4 PESAJE</div>
      <div class="wizard-step" id="ws5">5 RESIDUO + CELDA</div>
      <div class="wizard-step" id="ws6">6 CONFIRMAR</div>
    </div>
    <div class="card" style="max-width:540px">
      <div id="wizard-body"></div>
    </div>
  </div>`;

  const wiz = { centro:null, conductor:null, vehiculo:null, tipoResiduo:null, celda:null, peso_bruto:null, distribucion:null };

  function setStep(n) {
    for(let i=1;i<=6;i++){
      const el=document.getElementById('ws'+i);
      if (!el) continue;
      if(i<n) el.className='wizard-step done';
      else if(i===n) el.className='wizard-step active';
      else el.className='wizard-step';
    }
  }

  function row(l,v){return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px"><span style="color:var(--text2)">${l}</span><span>${v}</span></div>`;}

  // STEP 1 — Centro de disposición
  async function renderStep1() {
    setStep(1);
    const centros = await api('listarCentros');
    const munMap  = {};
    (await api('listarMunicipios')).forEach(m => munMap[m.id_municipio] = m.Nombre);
    document.getElementById('wizard-body').innerHTML = `
      <div class="field">
        <label>CENTRO DE DISPOSICIÓN</label>
        <p style="font-size:11px;color:var(--text3);margin-bottom:8px">Selecciona el relleno al que ingresa el vehículo</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${centros.filter(c=>c.Activo).map(c=>`
            <div class="centro-option" data-id="${c.id_centro}" style="border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:all .2s">
              <div style="font-weight:600;font-size:13px">${c.Nombre}</div>
              <div style="font-size:11px;color:var(--text2);margin-top:2px">📍 ${munMap[c.id_municipio]||''} — ${c.Direccion||''}</div>
            </div>`).join('')}
        </div>
      </div>`;
    document.querySelectorAll('.centro-option').forEach(el => {
      el.addEventListener('click', () => {
        const centro = centros.find(c => c.id_centro === Number(el.dataset.id));
        wiz.centro = centro;
        el.style.borderColor='var(--primary)'; el.style.background='var(--primary-light)';
        setTimeout(renderStep2, 400);
      });
    });
  }

  // STEP 2 — Conductor
  function renderStep2() {
    setStep(2);
    document.getElementById('wizard-body').innerHTML = `
      <div class="alert alert-green" style="margin-bottom:10px">✓ Centro: <b>${wiz.centro.Nombre}</b></div>
      <div class="field"><label>CÉDULA DEL CONDUCTOR</label>
        <input id="inp-cedula" placeholder="Ej: 12345678" type="text" autocomplete="off"></div>
      <div id="conductor-info"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-secondary" id="btn-back0">← Atrás</button>
        <button class="btn btn-primary" id="btn-buscar-cond">BUSCAR →</button>
      </div>`;
    document.getElementById('btn-back0').addEventListener('click', renderStep1);
    document.getElementById('btn-buscar-cond').addEventListener('click', async () => {
      try {
        wiz.conductor = await api('buscarConductor', {cedula: document.getElementById('inp-cedula').value.trim()});
        document.getElementById('conductor-info').innerHTML =
          `<div class="alert alert-green" style="margin-top:8px">✓ <b>${wiz.conductor.Nombre}</b> — Cédula: ${wiz.conductor.Cedula}</div>`;
        setTimeout(renderStep3, 700);
      } catch(e){ toast(e.message,'error'); }
    });
  }

  // STEP 3 — Vehículo
  function renderStep3() {
    setStep(3);
    document.getElementById('wizard-body').innerHTML = `
      <div class="alert alert-green" style="margin-bottom:10px">✓ Conductor: <b>${wiz.conductor.Nombre}</b></div>
      <div class="field"><label>PLACA DEL VEHÍCULO</label>
        <input id="inp-placa" placeholder="Ej: ABC-123" type="text" style="text-transform:uppercase" autocomplete="off"></div>
      <div id="vehiculo-info"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-secondary" id="btn-back1">← Atrás</button>
        <button class="btn btn-primary" id="btn-buscar-veh">BUSCAR →</button>
      </div>`;
    document.getElementById('btn-back1').addEventListener('click', renderStep2);
    document.getElementById('btn-buscar-veh').addEventListener('click', async () => {
      try {
        const v = await api('buscarVehiculo', {placa: document.getElementById('inp-placa').value.trim()});
        if (String(v.id_contratista) !== String(wiz.conductor.id_contratista)) {
          toast(`⚠️ El vehículo pertenece a "${v.contratista}" pero el conductor es de otro contratista.`, 'error');
          return;
        }
        wiz.vehiculo = v;
        document.getElementById('vehiculo-info').innerHTML =
          `<div class="alert alert-green" style="margin-top:8px">✓ <b>${wiz.vehiculo.Modelo}</b> — Placa: ${wiz.vehiculo.Placa} — Tara: ${Number(wiz.vehiculo.Tara).toLocaleString()} kg<br><span style="color:var(--text2);font-size:11px">Contratista: ${wiz.vehiculo.contratista}</span></div>`;
        setTimeout(renderStep4, 700);
      } catch(e){ toast(e.message,'error'); }
    });
  }

  // STEP 4 — Pesaje
  function renderStep4() {
    setStep(4);
    document.getElementById('wizard-body').innerHTML = `
      <div class="alert alert-green" style="margin-bottom:10px">✓ Vehículo: <b>${wiz.vehiculo.Placa}</b> — Tara: ${Number(wiz.vehiculo.Tara).toLocaleString()} kg</div>
      <div class="field">
        <label>PESO BRUTO (kg) <span style="color:var(--text2);font-weight:400">— peso total del vehículo cargado en báscula</span></label>
        <input id="inp-peso" type="number" placeholder="Ej: 12500" min="1">
      </div>
      <div id="peso-calc"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-secondary" id="btn-back2b">← Atrás</button>
        <button class="btn btn-primary" id="btn-confirmar-peso">SIGUIENTE →</button>
      </div>`;
    document.getElementById('btn-back2b').addEventListener('click', renderStep3);
    document.getElementById('inp-peso').addEventListener('input', function() {
      const pb = Number(this.value);
      const tara = Number(wiz.vehiculo.Tara);
      const neto = pb - tara;
      const calc = document.getElementById('peso-calc');
      if (neto > 0) {
        calc.innerHTML = `
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-top:8px;font-size:12px">
            ${row('Peso bruto', pb.toLocaleString()+' kg')}
            ${row('Tara vehículo', tara.toLocaleString()+' kg')}
            ${row('Peso neto a descargar', '<b style="color:var(--green);font-size:14px">'+neto.toLocaleString()+' kg</b>')}
          </div>`;
      } else if (pb > 0) {
        calc.innerHTML = `<div class="alert alert-red" style="margin-top:8px">⚠️ Peso bruto debe ser mayor que la tara (${tara.toLocaleString()} kg)</div>`;
      } else { calc.innerHTML = ''; }
    });
    document.getElementById('btn-confirmar-peso').addEventListener('click', () => {
      const pb = Number(document.getElementById('inp-peso').value);
      const neto = pb - Number(wiz.vehiculo.Tara);
      if (!pb || neto <= 0) { toast('Ingresa un peso bruto válido (mayor que la tara)','error'); return; }
      wiz.peso_bruto = pb;
      renderStep5();
    });
  }

  // STEP 5 — Tipo residuo: el sistema asigna la celda con más espacio para el peso neto
  async function renderStep5() {
    setStep(5);
    const neto = wiz.peso_bruto - Number(wiz.vehiculo.Tara);
    document.getElementById('wizard-body').innerHTML = `<div style="color:var(--text2);font-size:12px;padding:8px 0">⏳ Cargando tipos de residuo...</div>`;
    const tipos = await api('listarTiposResiduo');
    document.getElementById('wizard-body').innerHTML = `
      <div class="alert alert-green" style="margin-bottom:10px">✓ Peso neto a descargar: <b>${neto.toLocaleString()} kg</b></div>
      <div class="field">
        <label>TIPO DE RESIDUO <span style="color:var(--text2);font-weight:400">(un solo tipo por viaje)</span></label>
        <select id="sel-tipo">
          <option value="">— Seleccione —</option>
          ${tipos.map(t=>`<option value="${t.id_tipoResiduo}">${t.Nombre}</option>`).join('')}
        </select>
      </div>
      <div id="celda-asignada"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-secondary" id="btn-back3b">← Atrás</button>
        <button class="btn btn-primary" id="btn-confirmar-tipo" disabled>SIGUIENTE →</button>
      </div>`;
    document.getElementById('btn-back3b').addEventListener('click', renderStep4);

    document.getElementById('sel-tipo').addEventListener('change', async function() {
      const id = this.value;
      const btnNext = document.getElementById('btn-confirmar-tipo');
      const info = document.getElementById('celda-asignada');
      if (!id) { info.innerHTML=''; btnNext.disabled=true; return; }
      info.innerHTML = `<div style="color:var(--text2);font-size:12px;padding:6px 0">⏳ Calculando distribución de carga para ${neto.toLocaleString()} kg...</div>`;
      btnNext.disabled = true;
      try {
        wiz.tipoResiduo = {id, nombre: this.options[this.selectedIndex].text};

        // Obtener TODAS las celdas activas para este tipo, ordenadas por menor acumulado
        const todasCeldas = await api('listarTodosTiposCelda');
        const todasCeldasData = await api('listarCeldas');

        // Normalizar activo: activo si no es explicitamente 0
        const esActivo = v => Number(v ?? 1) !== 0;

        const elegibles = todasCeldas
          .filter(tc => {
            const idTipo = String(tc.id_tipoResiduo ?? tc.id_tiporesiduo ?? '').trim();
            return idTipo === String(id).trim() && esActivo(tc.Activo ?? tc.activo);
          })
          .map(tc => {
            const idCelda = String(tc.id_celda ?? tc.id_Celda ?? '').trim();
            return todasCeldasData.find(c => String(c.id_celda ?? '').trim() === idCelda);
          })
          .filter(c => c && esActivo(c.Activo) && Number(c.Capacidad_max) > Number(c.Peso_acumulado))
          // Eliminar duplicados por id_celda (puede haber 2 tipos en misma celda)
          .filter((c, idx, arr) => arr.findIndex(x => String(x.id_celda) === String(c.id_celda)) === idx)
          .sort((a,b) => Number(a.Peso_acumulado) - Number(b.Peso_acumulado));

        if (!elegibles.length) {
          info.innerHTML = `<div class="alert alert-red" style="margin-top:6px">⚠️ No hay celdas disponibles para ${wiz.tipoResiduo.nombre}</div>`;
          wiz.celda = null; return;
        }

        // Distribuir carga entre celdas hasta cubrir el peso neto
        let restante = neto;
        const distribucion = [];
        for (const celda of elegibles) {
          if (restante <= 0) break;
          const disponible = Number(celda.Capacidad_max) - Number(celda.Peso_acumulado);
          if (disponible <= 0) continue; // saltar celdas sin espacio real
          const asignar = Math.min(restante, disponible);
          distribucion.push({ celda, asignar });
          restante -= asignar;
        }

        wiz.celda = distribucion[0].celda;         // celda principal
        wiz.distribucion = distribucion;            // distribución completa
        wiz.pesoNoAsignado = restante > 0 ? restante : 0;

        const cubreTotal = restante <= 0;

        const filas = distribucion.map(d => {
          const pct = Math.round(Number(d.celda.Peso_acumulado)/Number(d.celda.Capacidad_max)*100);
          const bcls = pct>=90?'badge-red':pct>=60?'badge-amber':'badge-green';
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span style="font-weight:600">${d.celda.Nombre}</span>
            <span class="badge ${bcls}" style="font-size:9px">${pct}% llena</span>
            <span style="color:var(--primary);font-weight:600">${d.asignar.toLocaleString()} kg</span>
          </div>`;
        }).join('');

        info.innerHTML = `
          <div class="alert ${cubreTotal?'alert-green':'alert-red'}" style="margin-top:6px">
            ${cubreTotal
              ? `✓ Carga distribuida en ${distribucion.length} celda${distribucion.length>1?'s':''}`
              : `⚠️ Capacidad insuficiente — ${restante.toLocaleString()} kg no pueden ser asignados`}
          </div>
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-top:6px">
            <div style="font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;margin-bottom:6px">DISTRIBUCIÓN DE DESCARGA</div>
            ${filas}
            <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;font-weight:600;margin-top:4px">
              <span>Total asignado</span>
              <span style="color:var(--primary)">${(neto-Math.max(restante,0)).toLocaleString()} / ${neto.toLocaleString()} kg</span>
            </div>
          </div>`;
        btnNext.disabled = !cubreTotal && distribucion.length === 0;
      } catch(e) {
        info.innerHTML = `<div class="alert alert-red" style="margin-top:6px">⚠️ ${e.message}</div>`;
        wiz.celda = null;
      }
    });
    document.getElementById('btn-confirmar-tipo').addEventListener('click', renderStep6);
  }

  // STEP 6 — Confirmar + alerta sobrepeso
  async function renderStep6() {
    setStep(6);
    const pb = wiz.peso_bruto;
    const tara = Number(wiz.vehiculo.Tara);
    const neto = pb - tara;
    const dist = wiz.distribucion || [{celda: wiz.celda, asignar: neto}];

    // Verificar límite autorizado para mostrar advertencia
    let alertaSobrepeso = '';
    try {
      const limite = await api('verificarLimite', {
        id_tipoVehiculo: wiz.vehiculo.id_tipoVehiculo,
        id_tipoResiduo: wiz.tipoResiduo.id,
        peso_neto: neto
      });
      if (limite.sobrepeso) {
        alertaSobrepeso = `<div class="alert alert-red" style="margin-bottom:12px">
          ⚠️ <b>SOBREPESO DETECTADO</b> — Exceso: ${limite.exceso.toLocaleString()} kg sobre el límite de ${limite.peso_max.toLocaleString()} kg.<br>
          <span style="font-size:11px">El vehículo puede ingresar y descargar. Se generará multa en la liquidación mensual.</span>
        </div>`;
      }
    } catch(e) { /* si no hay límite configurado, continúa sin alerta */ }

    const filasDist = dist.map(d =>
      `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px">
        <span style="color:var(--text2)">Celda: <b>${d.celda.Nombre}</b></span>
        <span style="color:var(--primary);font-weight:600">${d.asignar.toLocaleString()} kg</span>
      </div>`
    ).join('');

    document.getElementById('wizard-body').innerHTML = `
      ${alertaSobrepeso}
      <div style="margin-bottom:14px">
        <div class="page-title" style="font-size:11px;margin-bottom:10px">RESUMEN DE INGRESO</div>
        ${row('Conductor', wiz.conductor.Nombre)}
        ${row('Vehículo', wiz.vehiculo.Modelo + ' — ' + wiz.vehiculo.Placa)}
        ${row('Contratista', wiz.vehiculo.contratista)}
        ${row('Tipo de residuo', wiz.tipoResiduo.nombre)}
        ${row('Peso bruto', pb.toLocaleString() + ' kg')}
        ${row('Tara', tara.toLocaleString() + ' kg')}
        ${row('Peso neto', '<b style="color:var(--success);font-size:15px">' + neto.toLocaleString() + ' kg</b>')}
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:14px">
        <div style="font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;margin-bottom:6px">
          DESCARGA EN ${dist.length} CELDA${dist.length>1?'S':''}
        </div>
        ${filasDist}
      </div>
      <div class="field" style="margin-top:12px">
        <label>Observaciones <span style="color:var(--text3);font-weight:400">(opcional)</span></label>
        <textarea id="inp-obs" rows="2" placeholder="Ej: Vehículo en buen estado, sin novedad..." style="resize:vertical"></textarea>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary" id="btn-cancel-ing"><i class="fa-solid fa-xmark"></i> Cancelar</button>
        <button class="btn btn-primary" id="btn-confirm-ing"><i class="fa-solid fa-check"></i> Confirmar Ingreso</button>
      </div>`;
    document.getElementById('btn-cancel-ing').addEventListener('click', () => { wiz.conductor=null; wiz.vehiculo=null; renderStep1(); });
    document.getElementById('btn-confirm-ing').addEventListener('click', async () => {
      const btn = document.getElementById('btn-confirm-ing');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
      try {
        // Enviar la celda principal y la distribución completa
        const res = await api('registrarIngreso', {
          id_centro: wiz.centro?.id_centro || 1,
          id_vehiculo: wiz.vehiculo.id_vehiculo,
          id_conductor: wiz.conductor.id_conductor,
          id_tipoResiduo: wiz.tipoResiduo.id,
          id_celda: dist[0].celda.id_celda,
          celdas_distribucion: dist.map(d => ({id_celda: d.celda.id_celda, kg: d.asignar})),
          id_usuario: S.user.id_usuario,
          usuario_nombre: S.user.usuario,
          peso_bruto: wiz.peso_bruto,
          observaciones: document.getElementById('inp-obs')?.value || '',
        });
        runFlow('registrarIngreso');
        toast(`✓ Ingreso #${res.id_ingreso} registrado. Peso neto: ${Number(res.peso_neto).toLocaleString()} kg en ${dist.length} celda${dist.length>1?'s':''}`);
        if (res.sobrepeso) setTimeout(()=>toast(`⚠️ Multa por sobrepeso: ${Number(res.exceso).toLocaleString()} kg de exceso`, 'error'), 1200);
        setTimeout(renderStep1, 1800);
      } catch(e) { btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i> Confirmar Ingreso'; toast(e.message,'error'); }
    });
  }

  renderStep1();
}

async function screenCeldas(c) {
  c.innerHTML = `<div class="fadein">

            <td><b>${ce.Nombre}</b></td>
            <td style="font-size:11px;color:var(--text2)">${ce.centro_nombre||'—'}</td>
            <td><span class="badge badge-blue" style="font-size:10px">${u.Simbolo}</span></td>
            <td>${Number(ce.Capacidad_max).toLocaleString()} kg</td>
            <td>${Number(ce.Peso_acumulado).toLocaleString()} kg</td>
            <td style="min-width:100px">
              <div style="display:flex;align-items:center;gap:6px">
                <div class="progress" style="flex:1"><div class="progress-fill ${pcls}" style="width:${pct}%"></div></div>
                <span class="badge ${bcls}" style="font-size:9px">${pct}%</span>
              </div>
            </td>
            <td><span class="badge ${Number(ce.Activo)?'badge-green':'badge-red'}">${Number(ce.Activo)?'ACTIVA':'INACTIVA'}</span></td>
            <td style="display:flex;gap:4px">
              <button class="btn btn-secondary" style="font-size:10px;padding:4px 8px" data-detail="${ce.id_celda}">VER</button>
              <button class="btn btn-secondary" style="font-size:10px;padding:4px 8px" data-edit="${ce.id_celda}" data-nombre="${ce.Nombre}" data-cap="${ce.Capacidad_max}" data-activo="${ce.Activo}">EDITAR</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;

    // Botón VER — modal de detalles
    document.querySelectorAll('[data-detail]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.detail;
        const celda = (await api('listarCeldas')).find(c=>String(c.id_celda)===String(id));
        const tiposCelda = await api('listarTiposCelda', {id_celda: id});
        const pct = celda.Capacidad_max>0 ? Math.round(Number(celda.Peso_acumulado)/Number(celda.Capacidad_max)*100) : 0;
        const bcls = pct>=90?'badge-red':pct>=60?'badge-amber':'badge-green';
        openModal(`
          <div class="modal-title"><i class="fa-solid fa-layer-group"></i> Detalle Celda — ${celda.Nombre}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
            <div class="stat-card"><div class="stat-val">${Number(celda.Capacidad_max).toLocaleString()}</div><div class="stat-label">Capacidad máx (kg)</div></div>
            <div class="stat-card"><div class="stat-val" style="color:${pct>=90?'var(--red)':pct>=60?'var(--amber)':'var(--green)'}">${pct}%</div><div class="stat-label">Ocupación actual</div></div>
          </div>
          <div class="progress" style="margin-bottom:12px;height:10px">
            <div class="progress-fill ${pct>=90?'high':pct>=60?'mid':'low'}" style="width:${pct}%"></div>
          </div>
          <div style="font-size:12px;margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
              <span style="color:var(--text2)">Peso acumulado</span><span>${Number(celda.Peso_acumulado).toLocaleString()} kg</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
              <span style="color:var(--text2)">Disponible</span><span style="color:var(--green)">${(Number(celda.Capacidad_max)-Number(celda.Peso_acumulado)).toLocaleString()} kg</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
              <span style="color:var(--text2)">Estado</span><span><span class="badge ${Number(celda.Activo)?'badge-green':'badge-red'}">${Number(celda.Activo)?'ACTIVA':'INACTIVA'}</span></span>
            </div>
          </div>
          <div style="font-size:11px;font-family:var(--mono);color:var(--text2);margin-bottom:6px;letter-spacing:1px">TIPOS DE RESIDUO AUTORIZADOS</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
            ${tiposCelda.length ? tiposCelda.map(t=>`<span class="badge badge-blue">${t.Nombre}</span>`).join('') : '<span style="color:var(--text3);font-size:12px">Sin tipos asignados — configura en EDITAR</span>'}
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-close>CERRAR</button>

    });

    // Botón EDITAR
    document.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const idCelda  = btn.dataset.edit;
        const tiposC   = await api('listarTiposCelda', {id_celda: idCelda});
        const tiposOpts = tipos.filter(t => !tiposC.find(tc => String(tc.id_tipoResiduo) === String(t.id_tipoResiduo)));
        const tiposBadges = tiposC.length
          ? tiposC.map(t => `<span class="badge badge-blue" style="cursor:pointer" title="Clic para remover" data-rm-tipo="${t.id_celdaResiduo}">${t.Nombre} ✕</span>`).join('')
          : '<span style="color:var(--text3);font-size:12px">Sin tipos asignados</span>';
        openModal(`
          <div class="modal-title"><i class="fa-solid fa-layer-group"></i> Editar Celda — ${btn.dataset.nombre}</div>

          <div class="field"><label>CAPACIDAD MÁX (kg)</label><input id="m-cap" type="number" value="${btn.dataset.cap}"></div>

                <option value="">+ Agregar tipo de residuo…</option>

          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-close>CANCELAR</button>
            <button class="btn btn-primary" data-confirm>GUARDAR</button>
          </div>`, async () => {
          await api('editarCelda', {
            id_celda: idCelda,
            nombre: document.getElementById('m-nombre').value,
            capacidad_max: document.getElementById('m-cap').value,
            activo: document.getElementById('m-activo').value
          });
          toast('Celda actualizada'); runFlow('gestionCeldas'); load();
        });
        // Asignar tipo
        document.getElementById('btn-add-tipo')?.addEventListener('click', async () => {
          const v = document.getElementById('m-tipo-add')?.value;
          if (!v) return;
          await api('asignarTipoResiduo', {id_celda: idCelda, id_tipoResiduo: v});
          toast('Tipo asignado ✓'); closeModal(); load();
        });
        // Remover tipo (marcar inactivo)
        document.querySelectorAll('[data-rm-tipo]').forEach(b => {
          b.addEventListener('click', async () => {
            const rel = DB.Celda_Tipo_residuo.find(r => r.id_celdaResiduo === Number(b.dataset.rmTipo));
            if (rel) { rel.Activo = 0; toast('Tipo removido'); closeModal(); load(); }
          });
        });
      });
    });
  }

  document.getElementById('btn-nueva-celda').addEventListener('click', () => {
    const uOpts = unidades.map(u=>`<option value="${u.id_unidadMedida}" data-factor="${u.Factor_a_kg}" data-sim="${u.Simbolo}">${u.Nombre} (${u.Simbolo})</option>`).join('');
    openModal(`
      <div class="modal-title"><i class="fa-solid fa-layer-group"></i> Nueva Celda</div>
      <div class="field"><label>NOMBRE</label><input id="m-nombre" placeholder="Celda X-00"></div>
      <div class="field"><label>CENTRO DE DISPOSICIÓN</label>
        <select id="m-centro">
          ${centros.map(ct=>`<option value="${ct.id_centro}">${ct.Nombre}</option>`).join('')}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field"><label>UNIDAD DE MEDIDA</label>
          <select id="m-unidad">${uOpts}</select>
        </div>
        <div class="field"><label id="m-cap-label">CAPACIDAD MÁX</label>
          <input id="m-cap" type="number" placeholder="10000">
        </div>
      </div>
      <div id="m-cap-hint" style="font-size:11px;color:var(--primary);background:var(--primary-light);padding:7px 10px;border-radius:var(--r);margin-top:-8px;margin-bottom:8px;display:none"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close>CANCELAR</button>
        <button class="btn btn-primary" data-confirm>CREAR</button>
      </div>`, async () => {
      await api('crearCelda', {
        nombre: document.getElementById('m-nombre').value,
        capacidad_max: document.getElementById('m-cap').value,
        id_unidadMedida: document.getElementById('m-unidad').value,
        id_centro: document.getElementById('m-centro').value,
      });
      toast('Celda creada'); runFlow('gestionCeldas'); load();
    });
    // Actualizar hint de conversión al cambiar unidad o valor
    function updateHint() {
      const sel   = document.getElementById('m-unidad');
      const opt   = sel.options[sel.selectedIndex];
      const factor = Number(opt?.dataset.factor || 1);
      const sim   = opt?.dataset.sim || 'kg';
      const val   = Number(document.getElementById('m-cap')?.value || 0);
      const hint  = document.getElementById('m-cap-hint');
      const label = document.getElementById('m-cap-label');
      if (label) label.textContent = 'CAPACIDAD MÁX (' + sim + ')';
      if (hint) {
        if (factor !== 1 && val > 0) {
          hint.textContent = '✓ Equivale a ' + (val * factor).toLocaleString('es-CO') + ' kg en el sistema';
          hint.style.display = 'block';
        } else if (factor !== 1) {
          hint.textContent = 'Ingresa el valor en ' + sim + ' — el sistema convierte automáticamente a kg';
          hint.style.display = 'block';
        } else {
          hint.style.display = 'none';
        }
      }
    }
    setTimeout(() => {
      document.getElementById('m-unidad')?.addEventListener('change', updateHint);
      document.getElementById('m-cap')?.addEventListener('input', updateHint);
      updateHint();
    }, 50);
  });

  await load();
}

// ----- OCUPACION -----
